<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>ELEV8 — You've won a gift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=GFS+Didot&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #153439;
    --cream: #DFC9B9;
    --brown: #775342;
    --white: #F6F3EF;
    --muted: rgba(246,243,239,0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--teal); }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--white);
    min-height: 100vh;
    display:flex; align-items:center; justify-content:center;
    padding: 30px 14px;
    background-image:
      linear-gradient(rgba(223,201,185,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(223,201,185,0.05) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .frame {
    width:100%; max-width: 420px;
    border: 1px solid rgba(223,201,185,0.25);
    padding: 34px 26px 26px;
  }
  .badge {
    display:flex; align-items:center; gap:8px; width:max-content;
    border: 1px solid rgba(246,243,239,0.4);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 10.5px; font-weight:700; letter-spacing:0.06em;
    color: var(--white);
    margin: 0 auto 28px;
  }
  .badge .dot { width:5px; height:5px; border-radius:50%; background: var(--white); flex-shrink:0; }
  .logo-row { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom: 24px; }
  .logo-row img { height: 34px; width:auto; }
  .logo-row .sep { font-size:16px; color: rgba(246,243,239,0.4); font-family:'Inter',sans-serif; font-weight:300; }
  .logo-row .seaside-logo { height: 46px; }
  h1 {
    font-family:'GFS Didot', serif; font-weight:400;
    font-size: clamp(23px, 7vw, 29px); line-height:1.32;
    text-align:center; color: var(--white); margin:0 0 16px;
  }
  .rule { width:34px; height:1px; background: var(--brown); margin: 0 auto 22px; }
  .sub {
    text-align:center; font-size:14.5px; line-height:1.7;
    color: var(--muted); max-width: 320px; margin: 0 auto 28px;
  }
  .sub strong { color: var(--white); font-weight:600; }

  .card { background: var(--cream); border-radius: 4px; padding: 24px; color: var(--teal); }
  .card .label { font-size:11px; font-weight:700; letter-spacing:0.06em; color: var(--brown); margin-bottom:12px; }
  .field-row { display:flex; align-items:center; border-bottom: 1px solid rgba(21,52,57,0.2); padding-bottom:10px; margin-bottom:18px; transition:border-color .15s ease; }
  .field-row:focus-within { border-color: var(--brown); }
  input[type=text], input[type=tel] {
    flex:1; background:transparent; border:none; outline:none;
    font-family:'Inter',sans-serif; font-size:16px; color: var(--teal);
  }
  input[type=text]::placeholder, input[type=tel]::placeholder { color: rgba(21,52,57,0.35); }
  .card-divider { height:1px; background: rgba(21,52,57,0.15); margin: 18px 0; }
  .claim-btn {
    width:100%;
    display:flex; align-items:center; justify-content:center; gap:10px;
    background: var(--brown); color: var(--white);
    border:none; border-radius:3px;
    padding:15px 20px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:15.5px;
    cursor:pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
  }
  .claim-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 16px rgba(21,52,57,0.3);
  }
  .claim-btn:active:not(:disabled) {
    transform: translateY(0) scale(0.97);
    box-shadow: 0 2px 6px rgba(21,52,57,0.22);
  }
  .claim-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }
  .claim-btn:disabled { opacity:0.75; cursor:default; }
  @media (prefers-reduced-motion: reduce) {
    .claim-btn:hover:not(:disabled), .claim-btn:active:not(:disabled) { transform:none; }
  }
  .btn-spinner {
    width:14px; height:14px; border-radius:50%; flex-shrink:0;
    border: 2px solid rgba(246,243,239,0.35);
    border-top-color: var(--white);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { font-size:12px; color: var(--brown); margin-top:14px; }
  .error-msg { font-size:12.5px; color:#9A3D2E; min-height:1em; margin: -8px 0 14px; }

  .result-text { font-size:14px; line-height:1.65; color: rgba(21,52,57,0.78); }

  .card-state.hide { display:none; }
  .card-state.reveal { animation: fadeUp 0.5s ease; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce) { .card-state.reveal { animation:none; } }

  footer {
    display:flex; align-items:center; justify-content:space-between;
    margin-top: 30px; padding-top: 20px; border-top: 1px solid rgba(223,201,185,0.18);
  }
  .footer-left { display:flex; align-items:center; gap:12px; }
  .footer-left img { height:19px; width:auto; }
  .footer-divider { width:1px; height:24px; background: rgba(223,201,185,0.3); }
  .footer-left .tag { font-size:11.5px; font-weight:700; letter-spacing:0.02em; line-height:1.3; color: var(--white); }
  .footer-right { font-size:10.5px; letter-spacing:0.07em; color: var(--muted); text-align:right; line-height:1.4; }
</style>
</head>

<script>
  const INSTAGRAM_URL = "https://www.instagram.com/elev8_eg/";
  const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzgZamTfaVAnR-8G-sZzWKgAhsYmbgtqfMmVMwMcfIUos92dOTAMmyUq0q5I50jREsL/exec";

  // The Sheet is the single source of truth for duplicate checks AND logging,
  // so this page works no matter where it's hosted (GitHub Pages, Netlify, anywhere).
  async function checkAndLog(name, phone, jobTitle) {
    if (!SHEET_WEBHOOK_URL) return { alreadyClaimed: false };
    try {
      const resp = await fetch(SHEET_WEBHOOK_URL, {
        method: 'POST',
        body: JSON.stringify({ name: name, phone: phone, jobTitle: jobTitle })
      });
      const data = await resp.json();
      return { alreadyClaimed: data.status === 'duplicate' };
    } catch (e) {
      console.error('ELEV8 gift: sheet check failed', e);
      return { alreadyClaimed: false }; // fail open — don't block a real customer over a network glitch
    }
  }

  function normalizePhone(raw) {
    const digits = raw.replace(/\D/g, '');
    return digits.slice(-10); // last 10 digits, absorbs country-code/leading-0 variation
  }

  function isValidPhone(raw) {
    const cleaned = raw.trim().replace(/[\s\-()]/g, '');
    return /^\+?[0-9]{8,15}$/.test(cleaned);
  }

  // Live-filter stray characters as the person types (letters, symbols) — keeps digits, +, spaces, dashes, parens.
  phoneInput.addEventListener('input', function () {
    this.value = this.value.replace(/[^\d+\s\-()]/g, '');
  });

  function swap(showEl) {
    [cardClaim, cardResult].forEach(el => {
      el.classList.add('hide');
      el.classList.remove('reveal');
    });
    showEl.classList.remove('hide');
    void showEl.offsetWidth;
    showEl.classList.add('reveal');
  }

  function showResult(label, text) {
    resultLabel.textContent = label;
    resultText.textContent = text;
    swap(cardResult);
  }

  function goToInstagram() {
    window.location.href = INSTAGRAM_URL;
  }

  async function claim(name, phoneKey, jobTitle) {
    const { alreadyClaimed } = await checkAndLog(name, phoneKey, jobTitle);

    try { localStorage.setItem('elev8_gift_claim', '1'); } catch (e) {}

    if (alreadyClaimed) {
      showResult('Already claimed', 'This phone number has already claimed a gift. Taking you to our Instagram anyway — thanks for following!');
    } else {
      showResult('Gift claimed', 'Thanks, ' + name + '! Taking you to our Instagram…');
    }
    setTimeout(goToInstagram, 1400);
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorMsg.textContent = '';
    const name = nameInput.value.trim();
    const jobTitle = jobTitleInput.value.trim();
    if (name.length < 2) {
      errorMsg.textContent = 'Enter your name.';
      return;
    }
    if (!isValidPhone(phoneInput.value)) {
      errorMsg.textContent = 'Enter a valid phone number.';
      return;
    }
    if (jobTitle.length < 2) {
      errorMsg.textContent = 'Enter your job title.';
      return;
    }
    const phoneKey = normalizePhone(phoneInput.value);
    claimBtn.disabled = true;
    btnSpinner.style.display = 'inline-block';
    btnLabel.textContent = 'Checking…';
    claim(name, phoneKey, jobTitle).finally(() => {
      claimBtn.disabled = false;
      btnSpinner.style.display = 'none';
      btnLabel.textContent = 'Claim my gift';
    });
  });
</script>
</body>
</html>
